name: Deploy database

# Manual only: migrations reach a hosted project solely through this workflow
# (docs/plan.md §14). Uses GitHub Environments so each target has its own
# SUPABASE_PROJECT_REF / DB password.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Supabase project
        type: choice
        options: [notice-dev, notice-prod]
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the CLI version used in development.
          version: 2.117.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Dry-run migrations
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Check job prerequisites
        # Before touching anything: an empty JOB_SECRET would make every job
        # answer 403, and missing Vault secrets would leave them inert.
        # Uses the session pooler — GitHub runners have no IPv6, so the
        # direct db.<ref> host is unreachable.
        run: |
          if [ -z "${JOB_SECRET}" ]; then echo "JOB_SECRET secret is empty"; exit 1; fi
          missing=$(psql "$SUPABASE_DB_URL" \
            -tAc "select string_agg(name, ',') from vault.secrets where name in ('functions_url','job_secret')")
          for want in functions_url job_secret; do
            case ",$missing," in
              *",$want,"*) ;;
              *) echo "missing Vault secret: $want"; exit 1;;
            esac
          done
          # The Edge Functions read the SAME value as JOB_SECRET: pg_net sends
          # the Vault job_secret as the bearer token and the functions compare
          # it against their JOB_SECRET env. A mismatch fails closed (403) on
          # every nightly run, so compare them now instead of discovering it
          # the next morning.
          vault_job=$(psql "$SUPABASE_DB_URL" \
            -tAc "select decrypted_secret from vault.decrypted_secrets where name = 'job_secret' limit 1")
          if [ "$vault_job" != "$JOB_SECRET" ]; then
            echo "Vault job_secret does not equal the JOB_SECRET that will be set on the Edge Functions"; exit 1
          fi
          echo "job secrets match"
        env:
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy purge cleanup-users delete-account upload-photo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set job secret
        # pg_net calls the jobs with this bearer token; without it every
        # nightly invocation answers 403.
        run: supabase secrets set "JOB_SECRET=${{ secrets.JOB_SECRET }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Lint remote schema
        run: supabase db lint --linked --level warning --fail-on warning
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify production security posture
        # Fail-closed post-deployment check: captcha/auth hardening via the
        # Management API (auth config is not visible from Postgres), plus
        # private buckets, Vault secrets and scheduled-job health via SQL.
        # DB checks use the session pooler — GitHub runners have no IPv6.
        run: |
          missing_db=$(psql "$SUPABASE_DB_URL" -tAc "
            with checks(name, ok) as (
              values
                ('board-photos_private',
                  (select not public from storage.buckets where id = 'board-photos')),
                ('avatars_private',
                  (select not public from storage.buckets where id = 'avatars')),
                ('vault_functions_url',
                  (select exists (select 1 from vault.secrets where name = 'functions_url'))),
                ('vault_job_secret',
                  (select exists (select 1 from vault.secrets where name = 'job_secret'))),
                ('cron_expire-items',
                  (select count(*) = 1 from cron.job where jobname = 'expire-items')),
                ('cron_purge-nightly',
                  (select count(*) = 1 from cron.job where jobname = 'purge-nightly')),
                ('cron_cleanup-users-nightly',
                  (select count(*) = 1 from cron.job where jobname = 'cleanup-users-nightly')),
                ('cron_cleanup-upload-intents',
                  (select count(*) = 1 from cron.job where jobname = 'cleanup-upload-intents'))
            )
            select string_agg(name, ',') from checks where not coalesce(ok, false)")
          if [ -n "$missing_db" ]; then echo "db security check failed: $missing_db"; exit 1; fi
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -o /tmp/auth-config.json
          python3 - <<'EOF'
          import json, sys
          cfg = json.load(open('/tmp/auth-config.json'))
          bad = []
          if cfg.get('security_captcha_enabled') is not True:
            bad.append('captcha_enabled')
          if cfg.get('mailer_autoconfirm') is not False:
            bad.append('email_confirmations_on')
          allow = cfg.get('uri_allow_list') or ''
          if 'noticeboard://' not in allow:
            bad.append('redirect_allowlist_has_noticeboard_scheme')
          if not cfg.get('smtp_host'):
            bad.append('custom_smtp')
          if bad:
            print('auth security check failed: ' + ','.join(bad))
            sys.exit(1)
          print('production security posture OK')
          EOF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
