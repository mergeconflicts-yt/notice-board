name: Deploy database

# Manual only: migrations reach a hosted project solely through this workflow
# (docs/plan.md §14). Uses GitHub Environments so each target has its own
# SUPABASE_PROJECT_REF / DB password.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Supabase project
        type: choice
        options: [notice-dev, notice-prod]
        required: true

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the CLI version used in development.
          version: 2.117.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Dry-run migrations
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy purge cleanup-users delete-account
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set job secret
        # pg_net calls the jobs with this bearer token; without it every
        # nightly invocation answers 403.
        run: supabase secrets set "JOB_SECRET=${{ secrets.JOB_SECRET }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check Vault job secrets
        run: |
          missing=$(PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "host=db.$SUPABASE_PROJECT_REF.supabase.co port=5432 dbname=postgres user=postgres sslmode=require" \
            -tAc "select string_agg(name, ',') from vault.secrets where name in ('functions_url','job_secret')")
          for want in functions_url job_secret; do
            case ",$missing," in
              *",$want,"*) ;;
              *) echo "missing Vault secret: $want"; exit 1;;
            esac
          done
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Lint remote schema
        run: supabase db lint --linked --level warning --fail-on warning
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
