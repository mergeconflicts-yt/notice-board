name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new commit supersedes an in-progress run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Unit tests
        run: node scripts/run-unit-tests.cjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check supabase/functions/*/index.ts

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the CLI version used in development.
          version: 2.117.0

      - name: Start local stack
        # The pgTAP/lint job only needs the database, auth and storage schemas;
        # skip the UI/proxy/edge containers to start faster.
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,analytics,vector

      - name: Apply migrations
        run: supabase db reset

      - name: pgTAP tests
        run: supabase test db

      - name: Lint schema
        # --fail-on makes schema warnings fail the build (it otherwise always
        # exits 0).
        run: supabase db lint --level warning --fail-on warning

      - name: Stop local stack
        if: always()
        run: supabase stop
