<!doctype html>
<html>
  <body style="margin:0;background:#FBF5E9;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#3E362E;">
    <div style="max-width:480px;margin:0 auto;padding:32px 24px;">
      <h1 style="font-size:22px;margin:0 0 8px;">Confirm your new email</h1>
      <p style="font-size:15px;line-height:1.5;margin:0 0 20px;">
        Enter this code in the app to save this address to your account:
      </p>
      <div style="font-size:34px;font-weight:700;letter-spacing:6px;background:#FFFDF7;border:1px solid #EDE4D3;border-radius:14px;padding:18px;text-align:center;">
        {{ .Token }}
      </div>
      <p style="font-size:13px;color:#6B6156;margin:20px 0 0;">
        The code expires in 10 minutes. If you didn’t request it, you can ignore this email.
      </p>
    </div>
  </body>
</html>
