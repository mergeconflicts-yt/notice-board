appId: com.fridgeboard.app
---
# Account deletion on a signed build: profile -> Delete account -> confirm.
# Ends back at Welcome with the account gone.
# Covers prod-checklist §2 "deleting an account".
- runFlow: _guest.yaml
- tapOn:
    text: "You · E2E Guest"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertVisible: "E2E Guest"
- tapOn:
    text: "Delete account"
    retryTapIfNoChange: true
# Two "Delete account" texts match while the alert is up (profile row behind
# the modal + alert button) and the row sorts first — index 1 selects the
# alert button. A wrong pick taps the inert row (no UI change) and fails
# loudly via retry instead of silently passing.
- tapOn:
    text: "Delete account"
    above: "Cancel"
    index: 1
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Use as guest"
    timeout: 60000
