appId: host.exp.Exponent
---
# Post a date note: title, Today via the date grid, 9:30 AM via the wheels.
# The popup closes after each pick, so the time trigger is opened separately.
# Event default is tomorrow 9:00 AM, so "Set 9:30 AM" is deterministic.
- runFlow: ../helpers/_board.yaml
- tapOn:
    text: "+ Add note"
    retryTapIfNoChange: true
- tapOn:
    id: tab-date
    retryTapIfNoChange: true
- tapOn:
    id: date-title-field
- inputText: "E2E dentist"
- tapOn:
    id: pick-date
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: today-btn
    retryTapIfNoChange: true
- tapOn:
    id: pick-time
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: wheel-Minute-3
    retryTapIfNoChange: true
- tapOn:
    id: dt-done
    retryTapIfNoChange: true
- tapOn:
    text: "Post"
    retryTapIfNoChange: true
# Date cards render in a handwriting font that Maestro's text channel can't
# match (and extendedWaitUntil takes no id selector), so the card tap itself
# is the sync point: tapOn waits for testID note-card, then opens the detail
# screen. Saved type + content are verified through the Edit round-trip: the
# edit sheet reuses the system-font date-title-field input plus the pick-date
# / pick-time triggers (a wrong saved type would show no date fields; a
# dropped title would fail the text assert). The exact clock rendering is
# locale-dependent, so only the title text is asserted — not the time.
- tapOn:
    id: "note-card"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: "action-edit"
    retryTapIfNoChange: true
- assertVisible:
    id: "date-title-field"
- assertVisible: "E2E dentist"
- assertVisible:
    id: "pick-date"
- tapOn:
    id: "edit-cancel"
    retryTapIfNoChange: true
- tapOn:
    id: "action-remove"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "+ Add note"
    timeout: 15000
- runFlow: ../helpers/_teardown.yaml
