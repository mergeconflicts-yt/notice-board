appId: host.exp.Exponent
---
# Post a date note: title, Today via the date grid, 9:30 AM via the wheels.
# The popup closes after each pick, so the time trigger is opened separately.
# Event default is tomorrow 9:00 AM, so "Set 9:30 AM" is deterministic.
- runFlow: ../helpers/_board.yaml
- tapOn:
    text: "+ Add note"
    retryTapIfNoChange: true
- tapOn:
    id: tab-date
    retryTapIfNoChange: true
- tapOn:
    id: date-title-field
- inputText: "E2E dentist"
- tapOn:
    id: pick-date
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: today-btn
    retryTapIfNoChange: true
- tapOn:
    id: pick-time
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: wheel-Minute-3
    retryTapIfNoChange: true
- tapOn:
    id: dt-done
    retryTapIfNoChange: true
- tapOn:
    text: "Post"
    retryTapIfNoChange: true
# Date cards render in a handwriting font that Maestro's text channel can't
# match (and extendedWaitUntil takes no id selector), so the card tap itself
# is the sync point: tapOn waits for testID note-card, then opens the detail
# screen — which has no back testID, so remove the post (back navigation to
# the board) and finish on the static composer button like keep.yaml does.
- tapOn:
    id: "note-card"
    retryTapIfNoChange: true
- tapOn:
    id: "action-remove"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "+ Add note"
    timeout: 15000
- runFlow: ../helpers/_teardown.yaml
