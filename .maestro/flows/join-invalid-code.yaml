appId: host.exp.Exponent
---
# Negative join test: a bogus code shows the invalid-code error and joins
# nothing. No board is created, so no teardown is needed.
- runFlow: ../helpers/_guest.yaml
- tapOn:
    text: "Join a fridge"
    retryTapIfNoChange: true
- tapOn:
    id: invite-code-field
- inputText: "ZZZZZ-ZZZZZ"
- tapOn:
    text: "Join"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "That invite isn’t working. Ask for a fresh link."
    timeout: 30000
