appId: host.exp.Exponent
---
# Guest signup -> create fridge -> delete fridge. Covers welcome, guest
# name step, home, create form, and fridge deletion.
- runFlow: ../helpers/_guest.yaml
- tapOn:
    text: "Create a fridge"
    retryTapIfNoChange: true
- tapOn:
    id: fridge-name-field
- inputText: "E2E Fridge"
- tapOn:
    text: "Create"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "+ Add note"
    timeout: 30000
- runFlow: ../helpers/_teardown.yaml
