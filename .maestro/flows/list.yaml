appId: host.exp.Exponent
---
# Post a checklist via the composer. The first "List item..." row is empty,
# so tapping it focuses the first row.
- runFlow: ../helpers/_board.yaml
- tapOn:
    text: "+ Add note"
    retryTapIfNoChange: true
- tapOn:
    id: tab-list
    retryTapIfNoChange: true
- tapOn:
    id: list-title-field
- inputText: "E2E groceries"
- tapOn:
    id: list-item-field
- inputText: "E2E milk"
- tapOn:
    text: "Post"
    retryTapIfNoChange: true
# List cards render in a handwriting font that Maestro's text channel can't
# match (and extendedWaitUntil takes no id selector), so the card tap itself
# is the sync point: tapOn waits for testID note-card, then opens the detail
# screen — which has no back testID, so remove the post (back navigation to
# the board) and finish on the static composer button like keep.yaml does.
- tapOn:
    id: "note-card"
    retryTapIfNoChange: true
- tapOn:
    id: "action-remove"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "+ Add note"
    timeout: 15000
- runFlow: ../helpers/_teardown.yaml
