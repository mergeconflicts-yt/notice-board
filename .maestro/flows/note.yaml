appId: host.exp.Exponent
---
# Post a text note via the composer. Starts and ends hermetic (own fridge).
- runFlow: ../helpers/_board.yaml
- tapOn:
    text: "+ Add note"
    retryTapIfNoChange: true
- tapOn:
    id: note-field
- inputText: "E2E hello note"
- tapOn:
    text: "Post"
    retryTapIfNoChange: true
# Note cards render in a handwriting font that Maestro's text channel can't
# match (and extendedWaitUntil takes no id selector), so the card tap itself
# is the sync point: tapOn waits for testID note-card, then opens the detail
# screen. Saved type + content are verified through the Edit round-trip: the
# edit sheet is a system-font TextInput (like the caption field that
# photo-composer.yaml already asserts), so its text IS matchable. If the post
# had saved as the wrong type, the note-field would not exist; if the body
# had been dropped, the text assert would fail.
- tapOn:
    id: "note-card"
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: "action-edit"
    retryTapIfNoChange: true
- assertVisible:
    id: "note-field"
- assertVisible: "E2E hello note"
- tapOn:
    id: "edit-cancel"
    retryTapIfNoChange: true
- tapOn:
    id: "action-remove"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "+ Add note"
    timeout: 15000
- runFlow: ../helpers/_teardown.yaml
