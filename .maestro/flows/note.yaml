appId: host.exp.Exponent
---
# Post a text note via the composer. Starts and ends hermetic (own fridge).
- runFlow: ../helpers/_board.yaml
- tapOn:
    text: "+ Add note"
    retryTapIfNoChange: true
- tapOn:
    id: note-field
- inputText: "E2E hello note"
- tapOn:
    text: "Post"
    retryTapIfNoChange: true
# Note cards render in a handwriting font that Maestro's text channel can't
# match (and extendedWaitUntil takes no id selector), so the card tap itself
# is the sync point: tapOn waits for testID note-card, then opens the detail
# screen — which has no back testID, so remove the post (back navigation to
# the board) and finish on the static composer button like keep.yaml does.
- tapOn:
    id: "note-card"
    retryTapIfNoChange: true
- tapOn:
    id: "action-remove"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "+ Add note"
    timeout: 15000
- runFlow: ../helpers/_teardown.yaml
